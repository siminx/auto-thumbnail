[package]
name = "auto-thumbnail"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Converts various file formats into thumbnail image."

repository = "https://github.com/siminx/auto-thumbnail"
homepage = "https://github.com/siminx/auto-thumbnail"

exclude = [
    "demo",
    "*.dll"
]

[dependencies]
anyhow = "1"
image = "0.25"
log = "0.4"
oxipng = "10.2"
pdfium-render = { version = "0.9", optional = true }
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
tika-magic = "0.2"
video-rs = { version = "0.11", features = ["ndarray"], optional = true }
webp = "0.3"

[features]
default = [ "full" ]
image = []
video = [ "dep:video-rs" ]
pdf = [ "dep:pdfium-render" ]
full = [ "image", "video", "pdf" ]
